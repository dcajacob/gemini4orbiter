name: Gemini VIII native OpenGL

on:
  pull_request:
    branches: [codex/native-linux-opengl]
  push:
    tags: ['gemini-viii-linux-opengl-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-inflation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  replay:
    if: github.event_name != 'push' || !github.event.deleted
    name: Gemini VIII mission and mid-inflation drag
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Install compiler, Mesa and virtual desktop
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ninja-build pkg-config \
            git ca-certificates curl rsync python3-scipy unzip zstd libglu1-mesa-dev libgl-dev zlib1g-dev \
            xorg-dev libwayland-dev wayland-protocols libxkbcommon-dev libglx-mesa0 libgl1-mesa-dri \
            xvfb xauth x11-utils libxtst6 libqt6widgets6 libqt6gui6 libxcb-cursor0 qt6-qpa-plugins pulseaudio pulseaudio-utils fonts-dejavu-core
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select release packaging
        id: package
        env:
          EVENT: ${{ github.event_name }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "$EVENT" != pull_request ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet HEAD^1 HEAD -- .github/native-linux .github/workflows/gemini-viii.yml; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        with:
          repository: dcajacob/orbiter-cross-platform
          ref: codex/osiris-pre-apollo-physics
          path: orbiter-source
          persist-credentials: false
      - name: Build Orbiter, OpenGL and Gemini from source
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/orbiter-source"
          mkdir -p evidence
          git rev-parse HEAD > evidence/gemini-commit.txt
          git -C orbiter-source rev-parse HEAD > evidence/orbiter-commit.txt
          bash .github/native-linux/build.sh orbiter-source "$RUNNER_TEMP"
      - name: Stage verified runtime assets
        id: runtime
        run: bash .github/native-linux/prepare-runtime.sh "$RUNNER_TEMP"
      - name: Fly both entries and compare every physics step
        run: |
          mkdir -p "$RUNNER_TEMP/pulse-home"
          HOME="$RUNNER_TEMP/pulse-home" bash Native/verification/quiet.sh "$PWD/evidence/audio" \
            python3 Native/verification/gemini8/replay_inflation.py "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/flights"
      - name: Fly the linked Gemini VIII mission from launch through recovery
        run: |
          python3 Native/verification/gemini8/verify.py
          HOME="$RUNNER_TEMP/pulse-home" bash Native/verification/quiet.sh "$PWD/evidence/mission-audio" \
            python3 Native/verification/gemini8/replay.py "$RUNNER_TEMP/runtime" "$RUNNER_TEMP/mission" --linked --compact
      - name: Launch all 23 released saves through the Qt Launchpad
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/launcher-home"
          HOME="$RUNNER_TEMP/launcher-home" bash Native/verification/quiet.sh "$PWD/evidence/launcher-audio" \
            python3 Native/verification/gemini8/launcher.py "$RUNNER_TEMP/runtime" "$PWD/evidence/launcher"
      - name: Collect results and diagnostics
        if: always()
        run: |
          mkdir -p evidence
          if [[ -f evidence/launcher/results.json ]]; then
            python3 - >> "$GITHUB_STEP_SUMMARY" <<'PYTHON'
          import json
          from pathlib import Path
          checks = json.loads(Path("evidence/launcher/results.json").read_text())
          passed = sum(row["result"] == "passed" for row in checks)
          print(f"### Qt launcher — {passed}/23 Gemini VIII saves passed")
          for row in checks:
              print(f"- {row['scenario']} — {row['result']}")
          PYTHON
          fi
          flights="$RUNNER_TEMP/flights"
          if [[ -f "$flights/comparison.json" ]]; then
            cp "$flights/comparison.json" evidence/
            {
              echo "Orbiter $(cat evidence/orbiter-commit.txt)"
              echo ' ```json'
              cat evidence/comparison.json
              echo ' ```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          mission="$RUNNER_TEMP/mission"
          if [[ -d "$mission" ]]; then
            mkdir -p evidence/mission
            if [[ -f "$mission/mission.json" ]]; then
              cp "$mission/mission.json" evidence/mission/
              python3 - "$mission/mission.json" >> "$GITHUB_STEP_SUMMARY" <<'PYTHON'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          print(f"### Gemini VIII mission — {len(rows)} of 22 phases verified")
          for row in rows:
              print(f"- {row['phase']}")
          PYTHON
            fi
            for phase in "$mission"/*/; do
              [[ -d "$phase" ]] || continue
              dest="evidence/mission/$(basename "$phase")"
              mkdir -p "$dest"
              for file in input.scn saved.scn pilot-docked.txt burn-plan.json; do
                if [[ -f "$phase/$file" ]]; then cp "$phase/$file" "$dest/"; fi
              done
              if [[ -f "$phase/console.log" ]]; then tail -c 32768 "$phase/console.log" > "$dest/console.log"; fi
            done
          fi
          for case in fixed-bank-up mid-inflation; do
            if [[ -d "$flights/$case" ]]; then
              mkdir -p "evidence/$case"
              for file in console.log runner.log evidence/renderer-info.json evidence/numerics.json; do
                if [[ -f "$flights/$case/$file" ]]; then
                  tail -c 32768 "$flights/$case/$file" > "evidence/$case/${file##*/}"
                fi
              done
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gemini-viii-inflation-${{ github.run_attempt }}
          path: evidence/
          retention-days: 14

      - name: Package the verified runtime and check the split archive
        if: success() && steps.package.outputs.enabled == 'true'
        run: |
          # The drag comparison has consumed these multi-GB telemetry files.
          find "$RUNNER_TEMP/flights" -name '*.csv' -type f -delete
          bash .github/native-linux/packaging/package.sh "$RUNNER_TEMP/runtime" "$PWD/evidence" "$PWD/release-assets"
          cat "$PWD/release-assets/"*.tar.zst.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: success() && github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: verified-gemini-release
          path: release-assets/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

  publish:
    name: Publish verified tag
    needs: replay
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/native-linux/packaging
      - uses: actions/download-artifact@v8
        with:
          name: verified-gemini-release
          path: release-assets
      - name: Verify transferred assets and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets
          sha256sum -c SHA256SUMS.parts
          cat *.tar.zst.part[0-9][0-9] | sha256sum | diff - <(sed 's/  .*/  -/' *.tar.zst.sha256)
          python3 "$GITHUB_WORKSPACE/.github/native-linux/packaging/publish.py" "$PWD"
